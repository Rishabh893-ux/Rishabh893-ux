<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Rishabh Kasaudhan</title>
  <desc id="d">AI Engineer and Full Stack Developer. Building AI-powered products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset=".55" stop-color="#120f2a"/>
      <stop offset="1" stop-color="#0b1a24"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F7FF"/>
      <stop offset=".5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#00F7FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e40c9" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6e40c9" stop-opacity=".9"/>
      <stop offset="1" stop-color="#00F7FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowP" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6e40c9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6e40c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#00F7FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#00F7FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <path id="p1" d="M60 70 L170 120 L120 220 L250 260"/>
    <path id="p2" d="M1140 60 L1030 130 L1100 210 L960 260"/>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .node { fill: #00F7FF; animation: pulse 3s ease-in-out infinite; }
    .node.v { fill: #c4b5fd; }
    .edge { fill: none; stroke: #7aa2f7; stroke-opacity: .25; stroke-width: 1.2; }
    .orbA { animation: drift 12s ease-in-out infinite; }
    .orbB { animation: drift 14s ease-in-out infinite reverse; }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .chip rect { fill: #ffffff; fill-opacity: .04; stroke: #c4b5fd; stroke-opacity: .35; }
    .chip text { fill: #c0caf5; font-size: 14px; font-weight: 600; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 7s linear infinite; }
    @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
    @keyframes drift { 0%,100% { transform: translate(0,0) } 50% { transform: translate(30px,-14px) } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes scan { from { transform: translateX(-300px) } to { transform: translateX(1500px) } }
    @media (prefers-reduced-motion: reduce) {
      .node, .orbA, .orbB, .cursor, .scan { animation: none }
      .rise { animation: none; opacity: 1 }
    }
  </style>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <ellipse class="orbA" cx="260" cy="90" rx="260" ry="160" fill="url(#glowP)"/>
  <ellipse class="orbB" cx="960" cy="250" rx="280" ry="170" fill="url(#glowC)"/>
  <rect class="scan" x="0" y="0" width="160" height="320" fill="url(#line)" opacity=".06"/>

  <!-- left neural net -->
  <g>
    <path class="edge" d="M60 70 L170 120 L120 220 L250 260 M60 70 L120 220 M170 120 L250 260 M60 170 L170 120 M60 170 L120 220"/>
    <circle class="node" cx="60" cy="70" r="4"/>
    <circle class="node v" cx="170" cy="120" r="5" style="animation-delay:.6s"/>
    <circle class="node" cx="120" cy="220" r="4" style="animation-delay:1.2s"/>
    <circle class="node v" cx="250" cy="260" r="4" style="animation-delay:1.8s"/>
    <circle class="node" cx="60" cy="170" r="3" style="animation-delay:.9s"/>
    <circle r="3" fill="#ffffff"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  </g>

  <!-- right neural net -->
  <g>
    <path class="edge" d="M1140 60 L1030 130 L1100 210 L960 260 M1140 60 L1100 210 M1030 130 L960 260 M1150 150 L1030 130 M1150 150 L1100 210"/>
    <circle class="node v" cx="1140" cy="60" r="4"/>
    <circle class="node" cx="1030" cy="130" r="5" style="animation-delay:.7s"/>
    <circle class="node v" cx="1100" cy="210" r="4" style="animation-delay:1.4s"/>
    <circle class="node" cx="960" cy="260" r="4" style="animation-delay:2.1s"/>
    <circle class="node" cx="1150" cy="150" r="3" style="animation-delay:1s"/>
    <circle r="3" fill="#ffffff"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  </g>

  <!-- text -->
  <g text-anchor="middle">
    <text class="mono rise" x="600" y="78" font-size="15" fill="#7aa2f7" letter-spacing="4">HI, I'M</text>
    <text class="sans rise" x="600" y="142" font-size="62" font-weight="800" fill="url(#name)" letter-spacing="1" style="animation-delay:.15s">Rishabh Kasaudhan</text>
    <text class="sans rise" x="600" y="184" font-size="19" font-weight="600" fill="#e6edf3" letter-spacing="5" style="animation-delay:.3s">AI ENGINEER · FULL STACK DEVELOPER</text>
    <text class="mono rise" x="600" y="218" font-size="15" fill="#9aa5ce" style="animation-delay:.45s">&gt; building AI-powered products that ship<tspan class="cursor" fill="#00F7FF">▍</tspan></text>
  </g>

  <!-- chips -->
  <g class="sans rise" style="animation-delay:.6s" text-anchor="middle">
    <g class="chip"><rect x="333" y="246" width="110" height="32" rx="16"/><text x="388" y="267">AI Agents</text></g>
    <g class="chip"><rect x="453" y="246" width="96" height="32" rx="16"/><text x="501" y="267">Next.js</text></g>
    <g class="chip"><rect x="559" y="246" width="96" height="32" rx="16"/><text x="607" y="267">Gemini</text></g>
    <g class="chip"><rect x="665" y="246" width="96" height="32" rx="16"/><text x="713" y="267">Python</text></g>
    <g class="chip"><rect x="771" y="246" width="96" height="32" rx="16"/><text x="819" y="267">.NET 8</text></g>
  </g>
</svg>
