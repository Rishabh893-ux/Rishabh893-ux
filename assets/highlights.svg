<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 136" width="100%" role="img" aria-label="10+ public projects, 6 live on Vercel, 5 AI agent tools, 24 passing API tests">
  <title>Highlights in numbers</title>
  <style>
    .num { font: 800 40px 'Segoe UI', -apple-system, Inter, Roboto, Helvetica, Arial, sans-serif; }
    .lab { font: 600 15px 'Segoe UI', -apple-system, Inter, Roboto, Helvetica, Arial, sans-serif; fill: #c0caf5; }
    .tile { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
    @media (prefers-reduced-motion: reduce) { .tile { animation: none; opacity: 1 } }
  </style>
  <g class="tile" style="animation-delay:0.00s">
    <rect x="12" y="8" width="207" height="120" rx="20" fill="#0d1117" stroke="#00F7FF" stroke-opacity=".35"/>
    <rect x="32" y="24" width="36" height="4" rx="6" fill="#00F7FF"/>
    <text x="32" y="80" class="num" fill="#00F7FF">10+</text>
    <text x="32" y="108" class="lab">Public projects</text>
  </g>
  <g class="tile" style="animation-delay:0.15s">
    <rect x="235" y="8" width="207" height="120" rx="20" fill="#0d1117" stroke="#c4b5fd" stroke-opacity=".35"/>
    <rect x="255" y="24" width="36" height="4" rx="6" fill="#c4b5fd"/>
    <text x="255" y="80" class="num" fill="#c4b5fd">6</text>
    <text x="255" y="108" class="lab">Live on Vercel</text>
  </g>
  <g class="tile" style="animation-delay:0.30s">
    <rect x="458" y="8" width="207" height="120" rx="20" fill="#0d1117" stroke="#00F7FF" stroke-opacity=".35"/>
    <rect x="478" y="24" width="36" height="4" rx="6" fill="#00F7FF"/>
    <text x="478" y="80" class="num" fill="#00F7FF">5</text>
    <text x="478" y="108" class="lab">AI agent tools</text>
  </g>
  <g class="tile" style="animation-delay:0.45s">
    <rect x="681" y="8" width="207" height="120" rx="20" fill="#0d1117" stroke="#c4b5fd" stroke-opacity=".35"/>
    <rect x="701" y="24" width="36" height="4" rx="6" fill="#c4b5fd"/>
    <text x="701" y="80" class="num" fill="#c4b5fd">24</text>
    <text x="701" y="108" class="lab">Passing API tests</text>
  </g>
</svg>
